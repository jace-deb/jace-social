# Builds the Jace Social phone apps (mobile/: the live web app in a Capacitor shell).
# Every push uploads them as workflow artifacts; a tag like mobile-v1.0.0 also makes a
# GitHub Release (notes from mobile/CHANGELOG.md) with:
#   jace_social_mobile-<version>-android.apk       signed with the release key (secrets, see
#                                                  packaging/make_android_key.sh) so updates install
#   jace_social_mobile-<version>-ios-unsigned.ipa  for sideloading (AltStore / Sideloadly), since
#                                                  App Store builds need an Apple developer account
name: Phone apps

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in refs/tags/mobile-v*) V="${GITHUB_REF_NAME#mobile-v}";; esac
          echo "JACE_MOBILE_VERSION=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync android
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # a debug key changes every build, so phones couldn't update to the next release
            case "$GITHUB_REF" in refs/tags/*) echo "::error::Run packaging/make_android_key.sh first (sets the ANDROID_KEYSTORE_* secrets)"; exit 1;; esac
            echo "::warning::No release key: this test build is debug-signed"; exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name it
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/jace_social_mobile-$JACE_MOBILE_VERSION-android.apk"
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: dist/*.apk

  android-test:
    # install the APK on an emulator, open it and screenshot it (the screenshot is a workflow artifact)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mobile-android
          path: dl
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r dl/*.apk
            adb shell pm grant dev.jacedeb.jacesocial android.permission.RECORD_AUDIO
            adb shell monkey -p dev.jacedeb.jacesocial -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > home.png
            adb shell am start -a android.intent.action.VIEW -d jacesocial://invite/jacecraft dev.jacedeb.jacesocial
            sleep 12
            adb exec-out screencap -p > invite.png
            adb shell pidof dev.jacedeb.jacesocial
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-android-screenshots
          path: "*.png"

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in refs/tags/mobile-v*) V="${GITHUB_REF_NAME#mobile-v}";; esac
          echo "JACE_MOBILE_VERSION=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync ios
      - name: Build (unsigned)
        working-directory: mobile/ios/App
        run: |
          IFS=. read -r MA MI PA <<< "$JACE_MOBILE_VERSION"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build MARKETING_VERSION="$JACE_MOBILE_VERSION" CURRENT_PROJECT_VERSION=$((MA * 10000 + MI * 100 + PA)) \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: Package .ipa
        run: |
          mkdir -p ../dist Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "../dist/jace_social_mobile-$JACE_MOBILE_VERSION-ios-unsigned.ipa" Payload
          ls -l ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios
          path: dist/*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, android-test, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#mobile-v}"
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' mobile/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" files/* --title "Jace Social for phones $V" --notes-file notes.md
