# Part of "Build and release" (ci.yml): the native phone apps (docs/native-apps.md), still being
# built. Builds both, starts each (Android emulator, iOS simulator) and uploads screenshots of it.
# Nothing is published yet: the Capacitor app (mobile/) stays the released phone app until these
# do everything it does.
name: Native apps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        env:
          JACE_ANDROID_VERSION: "2.0.0"
          JACE_API_BASE: http://10.0.2.2:8787   # the fake API on the runner (debug builds only; not released)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name it
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/jace_social_native-android-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: native-android
          path: dist/*.apk

  android-run:
    # install it on an emulator, open it and screenshot it
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-android
          path: dl
      - name: Start the fake API
        run: nohup python3 native-test/mock_api.py 8787 > mock.log 2>&1 &
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r dl/*.apk
            adb shell monkey -p dev.jacedeb.jacesocial -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-start.png
            adb shell pidof dev.jacedeb.jacesocial
            adb shell am start -S -n dev.jacedeb.jacesocial/.MainActivity --es jace_token demo
            sleep 10
            adb exec-out screencap -p > android-chats.png
            adb shell "am start -S -n dev.jacedeb.jacesocial/.MainActivity --es jace_open 'chat/dm/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb?title=Steve'"
            sleep 10
            adb exec-out screencap -p > android-chat.png
            adb shell "am start -S -n dev.jacedeb.jacesocial/.MainActivity --es jace_open 'server/22222222-2222-2222-2222-222222222222?title=Jace%20Craft'"
            sleep 10
            adb exec-out screencap -p > android-server.png
            adb shell pidof dev.jacedeb.jacesocial
            adb logcat -d -s AndroidRuntime:E | tail -40
      - name: What the fake API was asked
        if: always()
        run: tail -40 mock.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android-screenshots
          path: "*.png"

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Make the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project JaceSocial.xcodeproj -scheme JaceSocial -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -20 build.log; exit 1; }
          test -d "build/Build/Products/Debug-iphonesimulator/Jace Social.app"
      - name: Start the fake API
        working-directory: .
        run: nohup python3 native-test/mock_api.py 8787 > mock.log 2>&1 &
      - name: Start it in the simulator and screenshot it
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "build/Build/Products/Debug-iphonesimulator/Jace Social.app"
          xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial
          sleep 15
          xcrun simctl io "$DEVICE" screenshot ../ios-start.png
          # signed in, against the fake API (started in the step before)
          curl -sS -m 5 -H "Authorization: Bearer demo" http://127.0.0.1:8787/api/v1/me | head -c 200; echo
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-chats.png
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo -jaceOpen dm:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:Steve
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-chat.png
          xcrun simctl terminate "$DEVICE" dev.jacedeb.jacesocial
          SIMCTL_CHILD_JACE_API_BASE=http://127.0.0.1:8787 xcrun simctl launch "$DEVICE" dev.jacedeb.jacesocial -jaceToken demo -jaceOpen "server:22222222-2222-2222-2222-222222222222:Jace Craft"
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ../ios-server.png
          tail -30 ../mock.log
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "Jace Social"' | grep -iE "jace api|error|fail|ats|transport" | tail -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios-screenshots
          path: "*.png"
